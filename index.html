<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ارتباط PawNova</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/css/all.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <img src="logo.svg" alt="لوگوی متنی PawNova" class="main-logo-svg">
            <p class="subtitle">برای دوستی که بهترین را سزاوار است</p>
        </div>

        <div class="links-section">
            
            <a href="https://t.me/MyPawNovaID" class="link-btn telegram-btn">
                <i class="fab fa-telegram icon"></i> 
                تلگرام
            </a>

            <a href="tel:+989123456789" class="link-btn phone-btn">
                <i class="fas fa-phone icon"></i>
                شماره تماس
            </a>

            <a href="mailto:pawnovapetshop@gmail.com" class="link-btn email-btn">
                <i class="fas fa-envelope icon"></i>
                ایمیل
            </a>

            <div id="website-disabled-btn" class="link-btn website-btn disabled-btn">
                <i class="fas fa-globe icon"></i> 
                وب‌سایت ما
            </div>
            
            <div id="instagram-disabled-btn" class="instagram-btn link-btn disabled-btn">
                <i class="fab fa-instagram icon"></i> 
                پیج اینستاگرام ما
            </div>
        </div>
        
        <div class="powered-by">
             Powered by Pawnova Group
        </div>
    </div>
    
    <div id="status-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <h2 id="modal-title"></h2>
                <p id="modal-text"></p>
            </div>
        </div>
    </div>

    <script>
        // دریافت عناصر مودال
        const modal = document.getElementById('status-modal');
        const instaBtn = document.getElementById('instagram-disabled-btn');
        const websiteBtn = document.getElementById('website-disabled-btn');
        const closeBtn = document.getElementsByClassName('close-btn')[0];
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        
        // تابع اصلی برای نمایش مودال با محتوای دلخواه
        function openModalWithContent(title, text) {
            modalTitle.innerHTML = title; 
            modalText.innerHTML = text; 
            modal.style.display = 'block'; 
        }

        // فعال‌سازی پاپ‌آپ برای دکمه وب‌سایت
        websiteBtn.addEventListener('click', function() {
            openModalWithContent(
                "🚧 وب‌سایت در حال ساخت",
                "دوست عزیز، وب‌سایت **PawNova** در حال حاضر در حال ساخت و آماده‌سازی است. بزودی در دسترس قرار می‌گیرد. از صبر شما متشکریم!"
            );
        });
        
        // فعال‌سازی پاپ‌آپ برای دکمه اینستاگرام
        instaBtn.addEventListener('click', function() {
            openModalWithContent(
                "❌ پیج اینستاگرام در دسترس نیست",
                "دوست عزیز، پیج اینستاگرام ما در حال حاضر فعال نیست و بزودی راه‌اندازی می‌شود. از صبر شما متشکریم!"
            );
        });

        // تابع بستن مودال
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // بستن مودال هنگام کلیک در خارج از محتوای آن
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
